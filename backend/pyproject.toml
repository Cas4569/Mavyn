[project]
name = "mavyn-backend"
version = "0.1.0"
description = "MAVYN Market Intelligence Backend for Dot & Key Hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uvicorn]
app = "src.main:app"
host = "0.0.0.0"
port = 8000
reload = true

[tool.ruff]
line-length = 100
target-version = "py312"